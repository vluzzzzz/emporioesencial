<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Cancelado — AirPods Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .card{background:#fff;border-radius:24px;padding:48px;text-align:center;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
    .icon{width:64px;height:64px;background:#6e6e73;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
    .icon svg{width:28px;height:28px;fill:#fff}
    h1{font-size:24px;font-weight:700;margin-bottom:8px;color:#1d1d1f}
    p{font-size:15px;color:#6e6e73;line-height:1.6;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;padding:14px 32px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;font-weight:500;font-size:15px;transition:transform .2s}
    .btn:hover{transform:scale(1.03)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></div>
    <h1>Pago Cancelado</h1>
    <p>El pago no se completó. No te preocupes, tu carrito sigue guardado. Podés intentar de nuevo o escribirnos por WhatsApp.</p>
    <a class="btn" href="/">Volver a la tienda</a>
  </div>
</body>
</html>
