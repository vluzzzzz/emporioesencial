<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso — AirPods Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .card{background:#fff;border-radius:24px;padding:48px;text-align:center;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
    .icon{width:64px;height:64px;background:#30D158;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
    .icon svg{width:28px;height:28px;fill:#fff}
    h1{font-size:24px;font-weight:700;margin-bottom:8px;color:#1d1d1f}
    p{font-size:15px;color:#6e6e73;line-height:1.6;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;padding:14px 32px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;font-weight:500;font-size:15px;transition:transform .2s}
    .btn:hover{transform:scale(1.03)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    <h1>¡Pago Exitoso!</h1>
    <p>Gracias por tu compra. Te enviaremos un WhatsApp para coordinar el envío. Si tenés dudas, escribinos al <strong>+56 9 4234 8587</strong>.</p>
    <a class="btn" href="/">Volver a la tienda</a>
  </div>
</body>
</html>
